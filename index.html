<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevent pinch-zoom, iOS bounce, and browser gesture interference -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>The Cul-De-Sac</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: fixed;          /* prevents iOS rubber-band scroll */
      touch-action: none;       /* hands all touch events to Phaser */
      -webkit-user-select: none;
      user-select: none;
      /* Push content above iOS home indicator / Android nav bar */
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left:   env(safe-area-inset-left,   0px);
      padding-right:  env(safe-area-inset-right,  0px);
    }

    canvas {
      display: block;
      touch-action: none;
      /* Shrink canvas slightly so it never bleeds under browser chrome */
      max-height: calc(100vh - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px));
    }

    /* Portrait mode overlay — nudge players to rotate */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 20px;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 9999;
    }
    #rotate-prompt .icon { font-size: 56px; }

    @media screen and (orientation: portrait) and (max-device-width: 1024px) {
      #rotate-prompt { display: flex; }
      canvas { display: none; }
    }
  </style>
</head>
<body>

  <div id="rotate-prompt">
    <div class="icon">&#8635;</div>
    <div>Rotate your device to play<br><strong>The Cul-De-Sac</strong></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="src/systems/Hitbox.js"></script>
  <script src="src/systems/CombatFX.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Raccoon.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
